; OcarinaVR settings (retraced.dll), read when the game starts.
; Every key can also be given by an environment variable RETRACED_<KEY> (in capitals), which wins:
; RETRACED_VR=1, ... "Play OcarinaVR.bat" sets the ones the VR mode needs.
; RETRACED=0 (no key) leaves the game exactly as Hookshot alone, without even loading the module.

enabled = 1          ; 0: the module loads, then steps aside
report_every = 300   ; rt_report.json is written again every N frames (at least 30)
rt_status = 0        ; (keep 0: a development line under Hookshot's frame counter)
vr_key_film = 0     ; (not used)
vr_arm_cm = 45      ; your arm, shoulder to wrist, in cm: a smaller number reaches farther (also in the Insert menu)
